<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Epic Byte Studio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline CSS for centering */
        .contact-details {
            text-align: center;
            margin: 20px 0;
        }
        .contact-details p {
            font-size: 1.2rem;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="Company Logo.png" alt="Company Logo">
            <h1>Epic Byte Studio</h1>
            <p>Your partner for innovative websites, apps, and mobile games</p>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
    <main>
        <h1>Contact Us</h1>
        <div class="contact-details">
            <p><span class="icon">📞</span> 01308226581</p>
            <p><span class="icon">📧</span> issacprosonno@gmail.com</p>
            <p><span class="icon">📍</span> House-21, Road-5, Rupnagar R/A, Mirpur, Dhaka-1216</p>
        </div>
        <form action="https://formsubmit.co/issacprosonno@gmail.com" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="contact">Contact Number:</label>
            <input type="text" id="contact" name="contact" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Epic Byte Studio</p>
    </footer>
</body>
</html>
